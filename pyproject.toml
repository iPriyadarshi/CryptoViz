[project]
name = "cryptoviz"
version = "1.0.0"
description = "Cryptocurrency analytics dashboard: live prices, trends, volatility, correlation and market sentiment."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"

dependencies = [
    "beautifulsoup4>=4.12",
    "flask>=3.1",
    "flask-cors>=5.0",
    "gunicorn>=23.0",
    "nltk>=3.9",
    "numpy>=2.1",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "sqlalchemy>=2.0",
]

[project.scripts]
# Development server. Production serves cryptoviz.wsgi:app through gunicorn.
cryptoviz-web = "cryptoviz.cli:run_web"
# Background scraper process (its own systemd unit in production).
cryptoviz-worker = "cryptoviz.cli:run_worker"
# One-off 31-day historical price backfill.
cryptoviz-backfill = "cryptoviz.cli:run_backfill"
# Single round of every scraper, for seeding or checking the sources.
cryptoviz-scrape-once = "cryptoviz.cli:scrape_once"
# Rebuild the price rollup buckets (only needed after a restore/import).
cryptoviz-rebuild-rollups = "cryptoviz.cli:rebuild_rollups"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cryptoviz"]

[tool.ruff]
line-length = 90
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # Long lines are left to the formatter's judgement rather than enforced.
    "E501",
    # try/except/continue around individual scraped rows is deliberate: one
    # malformed row must not abort the whole scrape.
    "B007",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
