# nginx site configuration for CryptoViz.
#
# Install to /etc/nginx/sites-available/cryptoviz (Ubuntu/Debian) or
# /etc/nginx/conf.d/cryptoviz.conf (Amazon Linux), then reload nginx.
#
# nginx serves the static assets straight off disk and proxies everything else
# to gunicorn over a unix socket, so Python never handles a CSS or JS request.

upstream cryptoviz_app {
    server unix:/run/cryptoviz/gunicorn.sock fail_timeout=0;
}

# Rate limit the API. The dashboard polls on a timer, so the limit is generous;
# it exists to blunt scripted abuse of the scrape-triggering endpoints.
limit_req_zone $binary_remote_addr zone=cryptoviz_api:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;

    # Replace with your domain or the instance's public DNS name.
    server_name _;

    # Scraped JSON payloads compress extremely well.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Upload size: nothing here accepts uploads, so keep it small.
    client_max_body_size 1m;

    access_log /var/log/nginx/cryptoviz.access.log;
    error_log  /var/log/nginx/cryptoviz.error.log;

    # --- Static assets -----------------------------------------------------
    # Served directly from the package. These are content-stable, so they get a
    # long cache lifetime; bump a filename if you need to bust it.
    location /css/ {
        alias /opt/cryptoviz/src/cryptoviz/static/css/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /js/ {
        alias /opt/cryptoviz/src/cryptoviz/static/js/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /assets/ {
        alias /opt/cryptoviz/src/cryptoviz/static/assets/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # --- Health check ------------------------------------------------------
    location = /healthz {
        proxy_pass http://cryptoviz_app;
        access_log off;
    }

    # --- API ---------------------------------------------------------------
    location /api/ {
        limit_req zone=cryptoviz_api burst=60 nodelay;

        proxy_pass http://cryptoviz_app;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Correlation over a long window is the slowest endpoint; keep this
        # above gunicorn's own timeout so nginx is not the one giving up first.
        proxy_read_timeout 75s;
    }

    # --- Application pages -------------------------------------------------
    location / {
        proxy_pass http://cryptoviz_app;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
